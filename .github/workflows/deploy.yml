name: Deploy

# Déploiement du front Next.js sur le VPS (même principe qu'alivaon-symfony) :
# images publiées sur GHCR puis `docker compose` sur le serveur, en ne
# touchant QUE les services web et admin (Symfony a son propre pipeline).
#
# - branche ≠ main → staging : web + admin (admin.staging / preview.staging) ;
# - main → production : l'ADMIN SEULEMENT (admin.alivaon.com, depuis le
#   24/09/2026). Le site public ne remplacera Symfony sur www qu'après le
#   contrôle de parité SEO (docs/seo-parity.md) : aucune image `site` n'est
#   publiée ni déployée en production d'ici là.
# Voir alivaon-infra/docs/next.md.
on:
  push:
    branches:
      - '**'
      - '!dependabot/**'
      - '!renovate/**'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: Image ${{ matrix.app }} (staging)
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [site, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: APP=${{ matrix.app }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/alivaon/alivaon-next-${{ matrix.app }}:${{ github.sha }}
            ${{ env.REGISTRY }}/alivaon/alivaon-next-${{ matrix.app }}:staging
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Déploiement staging
    if: github.ref != 'refs/heads/main'
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging-next
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/alivaon/staging
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            # Uniquement les services du front : jamais app ni db.
            docker compose pull web admin
            docker compose up -d --no-deps web admin
            for svc in web admin; do
              for i in $(seq 1 30); do
                status="$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q "$svc")")"
                [ "$status" = "healthy" ] && break
                sleep 2
              done
              [ "$status" = "healthy" ] || { echo "ERREUR : $svc n'est pas healthy"; docker compose logs --tail=60 "$svc"; exit 1; }
            done
            echo "OK : web et admin healthy"

  production-image:
    name: Image admin (production)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: APP=admin
          push: true
          tags: |
            ${{ env.REGISTRY }}/alivaon/alivaon-next-admin:${{ github.sha }}
            ${{ env.REGISTRY }}/alivaon/alivaon-next-admin:production
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  production-deploy:
    name: Déploiement production (admin)
    needs: production-image
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production-next
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/alivaon/production
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            # Uniquement l'admin : jamais app, db, ni un service web.
            docker compose pull admin
            docker compose up -d --no-deps admin
            for i in $(seq 1 30); do
              status="$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q admin)")"
              [ "$status" = "healthy" ] && break
              sleep 2
            done
            [ "$status" = "healthy" ] || { echo "ERREUR : admin n'est pas healthy"; docker compose logs --tail=60 admin; exit 1; }
            echo "OK : admin healthy"
