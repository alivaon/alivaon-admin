name: Deploy

# Déploiement du back-office Next.js sur le VPS : image publiée sur GHCR puis
# `docker compose` sur le serveur, en ne touchant QUE le service admin
# (Symfony et le site public ont leurs propres dépôts et pipelines).
#
# - branche ≠ main → staging (www.admin.staging.alivaon.com) ;
# - main → production (www.admin.alivaon.com, depuis le 24/09/2026).
# Voir alivaon-infra/docs/next.md.
on:
  push:
    branches:
      - '**'
      - '!dependabot/**'
      - '!renovate/**'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Image admin (staging)
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/alivaon/alivaon-next-admin:${{ github.sha }}
            ${{ env.REGISTRY }}/alivaon/alivaon-next-admin:staging
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  deploy:
    name: Déploiement staging
    if: github.ref != 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging-admin
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/alivaon/staging
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            # Uniquement l'admin : jamais app, db ni web.
            docker compose pull admin
            docker compose up -d --no-deps admin
            for i in $(seq 1 30); do
              status="$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q admin)")"
              [ "$status" = "healthy" ] && break
              sleep 2
            done
            [ "$status" = "healthy" ] || { echo "ERREUR : admin n'est pas healthy"; docker compose logs --tail=60 admin; exit 1; }
            echo "OK : admin healthy"

  production-image:
    name: Image admin (production)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/alivaon/alivaon-next-admin:${{ github.sha }}
            ${{ env.REGISTRY }}/alivaon/alivaon-next-admin:production
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  production-deploy:
    name: Déploiement production (admin)
    needs: production-image
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production-admin
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/alivaon/production
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            # Uniquement l'admin : jamais app, db, ni un service web.
            docker compose pull admin
            docker compose up -d --no-deps admin
            for i in $(seq 1 30); do
              status="$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q admin)")"
              [ "$status" = "healthy" ] && break
              sleep 2
            done
            [ "$status" = "healthy" ] || { echo "ERREUR : admin n'est pas healthy"; docker compose logs --tail=60 admin; exit 1; }
            echo "OK : admin healthy"
