name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Types générés à jour par rapport à openapi.json (export Symfony).
      - run: pnpm --filter @alivaon/api-client run check-fresh
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  image:
    name: Image Docker (admin)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Construction seule : la publication et le déploiement sont dans deploy.yml.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
