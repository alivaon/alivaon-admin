name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Types générés à jour par rapport à openapi.json (export Symfony).
      - run: pnpm --filter @alivaon/api-client run check-fresh
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @alivaon/site --filter @alivaon/admin run build

  images:
    name: Images Docker (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      matrix:
        app: [site, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Construction seule : la publication (GHCR) et le déploiement arrivent
      # avec l'intégration au VPS, derrière le contrôle de parité SEO.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: APP=${{ matrix.app }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
